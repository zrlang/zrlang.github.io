# zr 教程章节
#
# status 反映「当前提交的编译器（v0.5.0）实际能不能跑」，
# 依据是 zr 仓库的 README.md 与 tests/README.md。
#
#   ready   已覆盖，测试通过
#   partial 部分可用，细节见 tests/README.md
#   planned 编译器尚未实现，本章是设计说明

- title: 安装与第一个程序
  url: /learn/getting-started/
  status: ready
  status_note: 构建编译器与交叉编译链路可用。
  summary: 从 git clone 到把程序编译成树莓派 / wasm 映像。

- title: 1. 基础语法
  url: /learn/01-syntax/
  status: partial
  status_note: >-
    变量、标量与浮点、运算符优先级与比较、函数、递归、while / loop / break / continue、
    if 作为表达式、else if 链、as 转换、字面量类型后缀均已通过测试（26 个用例中的 13 个）。
    当前唯一的语法缺口是 for —— a..b 区间表达式仍解析成标识符。
  summary: 变量与可变性、标量与复合类型、函数、控制流。

- title: 2. 所有权系统
  url: /learn/02-ownership/
  status: ready
  status_note: >-
    所有权规则、引用与借用、生命周期、Drop trait 均已实现；
    struct 与 impl 方法可用；唯一缺口是 trait 对象动态分派仍属于后续目标。
  summary: 所有权规则、引用与借用、生命周期、Drop 析构。

- title: 3. 结构体与枚举
  url: /learn/03-structs-enums/
  status: ready
  status_note: >-
    struct 构造、字段读写、嵌套、按值传参/返回、作用域析构、impl 方法均已实现；
    enum 与 Option 已支持；trait 对象动态分派仍属于后续目标。
  summary: 定义与实例化、impl 方法、枚举、Option。

- title: 4. 包管理与项目
  url: /learn/04-project/
  status: partial
  status_note: >-
    zr pkg（init / add / remove / list / tree / build / clean）、zr fmt、
    zr lsp 与增量编译（默认开启）都已落地。目前 zr pkg 只支持路径依赖，
    注册表协议与联网排在 v0.8.0；模块系统仍不完整，可靠做法是一个项目一个文件。
  summary: 编译模型、模块与可见性、zr pkg / fmt / lsp 与增量编译。

- title: 5. 集合类型
  url: /learn/05-collections/
  status: partial
  status_note: >-
    Vec<T> 已实现并可用；String 已实现；HashMap 尚未提供，
    目前可用 Vec<(K, V)> 做关联列表替代。
  summary: Vec<T>、String，以及 HashMap 的缺口。

- title: 6. 错误处理
  url: /learn/06-errors/
  status: ready
  status_note: >-
    panic、Result、? 运算符、unwrap_or 等均已实现。
  summary: panic、Result、? 运算符。

- title: 7. 泛型、Trait 与生命周期
  url: /learn/07-generics/
  status: partial
  status_note: >-
    泛型函数与类型、trait 与默认实现、trait bound、生命周期标注均已实现；
    唯一缺口是 trait 对象动态分派仍属于后续目标。
  summary: 泛型函数与类型、trait 与约束、生命周期。

- title: 8. 自动化测试
  url: /learn/08-testing/
  status: ready
  status_note: >-
    #[test] 测试桩已实现，cargo test 可驱动 tests/cases/*.zr 下的 26 个用例；
    每个用例在 -O0 到 -Oz 各编译运行一遍；但 zr test 子命令尚未接运行器。
  summary: 断言、用例组织、跨优化等级的运行器，以及 #[test]。

- title: 9. 函数式编程特性
  url: /learn/09-functional/
  status: ready
  status_note: >-
    闭包、高阶函数均已实现；std/slice.zr 里的高阶函数接受函数指针 fn(T) -> U。
  summary: 闭包、高阶函数、函数指针。

- title: 10. 智能指针
  url: /learn/10-pointers/
  status: partial
  status_note: >-
    Box<T> 已实现；Rc<T> / RefCell<T> 尚未实现；v0.7.0 已实现最小 SSA 内存模型：
    &x 取址、*p / *p = v / p[i]、指针算术 p + n / p - q，仅 x86-64 实现了栈溢出。
  summary: Box<T>、堆分配、栈槽与内存模型。

- title: 11. 并发编程
  url: /learn/11-concurrency/
  status: partial
  status_note: >-
    受限异步降级（async fn / .await / spawn 调度）已落地；线程、Mutex、
    Send/Sync 尚未实现；完整的 std::async 通道、join/race 与唤醒式执行器
    属于 v1.0 目标。
  summary: 一等协程、async/await、spawn 调度。

- title: 12. 面向对象特性
  url: /learn/12-oop/
  status: partial
  status_note: >-
    结构体、impl 方法已实现；trait 对象动态分派仍属于后续目标。
  summary: 封装、impl 方法、结构体更新语法。

- title: 13. 模式匹配
  url: /learn/13-patterns/
  status: ready
  status_note: >-
    match 已脱糖成 if/else 链并有完整运行期语义：字面量、_、绑定臂、
    或模式、guard，以及 bool 穷尽时不写尾 _（用例 25_match.zr）。
    枚举 payload / 范围模式尚未实现。
  summary: match、脱糖语义、绑定臂与守卫。

- title: 14. 高级特性
  url: /learn/14-advanced/
  status: partial
  status_note: >-
    comptime 编译期求值、完整属性系统、.rodata 字符串、extern "C" 接通运行时、
    指针与内存模型、内联汇编（x86-64）已落地；宏的代码生成、SIMD 指令选择
    仍未实现。
  summary: comptime、属性系统、指针与内存、宏、FFI、跨平台。