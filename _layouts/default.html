<!DOCTYPE html>
<html lang="{{ site.lang | default: 'zh-CN' }}" data-theme="dark">
<head>
  {%- include head.html -%}
</head>
<body class="{{ page.body_class | default: '' }}">
  <a class="skip-link" href="#main">跳到主要内容</a>

  {%- include header.html -%}

  <main id="main" class="{{ page.main_class | default: 'main' }}">
    {{ content }}
  </main>

  {%- include footer.html -%}

  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
  {%- for script in page.scripts -%}
  <script src="{{ script | relative_url }}" defer></script>
  {%- endfor -%}
</body>
</html>
